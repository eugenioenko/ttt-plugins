name: Validate language packs
on:
  push:
    paths: ["i18n/**", "ttt-i18n-*/**", ".github/workflows/i18n.yml"]
  pull_request:
    paths: ["i18n/**", "ttt-i18n-*/**", ".github/workflows/i18n.yml"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s i18n/tests
      - run: python3 i18n/scripts/translate.py validate
      - run: |
          python3 i18n/scripts/translate.py registry
          git diff --exit-code -- i18n/community-plugins.json
